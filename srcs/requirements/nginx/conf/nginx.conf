events {
    worker_connections 1024;
}

http {
    # Load MIME types (file extensions -> content types like HTML, CSS, images)
    include /etc/nginx/mime.types;

    server {
        listen 443 ssl;
        server_name bamezoua.42.fr;

        # SSL/TLS certificates
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /var/www/html;
        index index.php;

        # WordPress routing
        location / {
            # Try to serve static files first, then fallback to index.php for WordPress routing
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP processing via FastCGI
        location ~ \.php$ {
            include fastcgi_params; # Include standard FastCGI parameters
            fastcgi_pass wordpress:9000; # Pass PHP requests to the WordPress container's PHP-FPM service
            #  document_root: /var/www/html (set in Dockerfile) + fastcgi_script_name: /index.php or /wp-admin/admin.php
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
